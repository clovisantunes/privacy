    <!-- ===== META PIXEL ===== -->

        if (f.fbq) return;
        n = f.fbq = function () {

        t = b.createElement(e);

    <!-- ===== GOOGLE ANALYTICS ===== -->
    <script
      async
      src="https://www.googletagmanager.com/gtag/js?id=G-CZCEKMJJW8"
    ></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() {
        dataLayer.push(arguments);
      }
      gtag("js", new Date());
      gtag("config", "G-CZCEKMJJW8");

    <style>
      /* ===== RESET ===== */
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          "Helvetica Neue", Arial, sans-serif;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #000000;
        padding: 20px;
        position: relative;
        overflow: hidden;
      }

      body::before {
        content: "";
        position: fixed;
        top: -50%;
        left: -50%;
        width: 200%;
        height: 200%;
        background: radial-gradient(
            ellipse at 30% 50%,
            rgba(255, 101, 66, 0.06) 0%,
            transparent 60%
          ),
          radial-gradient(
            ellipse at 70% 50%,
            rgba(255, 101, 66, 0.04) 0%,
            transparent 60%
          );
        animation: backgroundPulse 8s ease-in-out infinite alternate;
        z-index: 0;
      }

      @keyframes backgroundPulse {
        0% {
          opacity: 0.5;
          transform: scale(1) rotate(0deg);
        }
        100% {
          opacity: 1;
          transform: scale(1.05) rotate(2deg);
        }
      }

      .age-verification {
        position: relative;
        z-index: 1;
        max-width: 440px;
        width: 100%;
        background: rgba(255, 255, 255, 0.03);
        backdrop-filter: blur(40px);
        -webkit-backdrop-filter: blur(40px);
        border: 1px solid rgba(255, 255, 255, 0.06);
        border-radius: 32px;
        padding: 48px 36px 36px;
        text-align: center;
        animation: fadeInUp 0.8s ease;
        box-shadow: 0 40px 80px rgba(0, 0, 0, 0.8),
          inset 0 1px 0 rgba(255, 255, 255, 0.05);
      }

      @keyframes fadeInUp {
        from {
          opacity: 0;
          transform: translateY(40px) scale(0.96);
        }
        to {
          opacity: 1;
          transform: translateY(0) scale(1);
        }
      }

      .age-logo {
        width: 160px;
        height: auto;
        margin-bottom: 32px;
        display: block;
        margin-left: auto;
        margin-right: auto;
        filter: brightness(1.1);
        transition: filter 0.3s ease;
      }

      .age-logo:hover {
        filter: brightness(1.2);
      }

      .age-title {
        font-size: 22px;
        font-weight: 600;
        color: rgba(255, 255, 255, 0.9);
        margin-bottom: 8px;
        letter-spacing: -0.3px;
      }

      .age-subtitle {
        font-size: 15px;
        color: rgba(255, 255, 255, 0.4);
        margin-bottom: 28px;
        line-height: 1.6;
        font-weight: 400;
      }

      .age-warning {
        background: rgba(255, 255, 255, 0.03);
        border: 1px solid rgba(255, 255, 255, 0.06);
        border-radius: 14px;
        padding: 16px 20px;
        margin-bottom: 28px;
        text-align: left;
      }

      .age-warning p {
        color: rgba(255, 255, 255, 0.5);
        font-size: 13px;
        line-height: 1.7;
      }

      .age-warning strong {
        color: #ff6542;
        font-weight: 600;
      }

      .age-btn {
        width: 100%;
        padding: 18px 24px;
        background: linear-gradient(135deg, #ff6542, #e84d2a);
        color: white;
        border: none;
        border-radius: 14px;
        font-size: 17px;
        font-weight: 700;
        cursor: pointer;
        transition: all 0.3s ease;
        box-shadow: 0 8px 32px rgba(255, 101, 66, 0.25);
        font-family: inherit;
        letter-spacing: 0.3px;
        position: relative;
        overflow: hidden;
      }

      .age-btn::before {
        content: "";
        position: absolute;
        top: 0;
        left: -100%;
        width: 100%;
        height: 100%;
        background: linear-gradient(
          90deg,
          transparent,
          rgba(255, 255, 255, 0.1),
          transparent
        );
        transition: left 0.5s ease;
      }

      .age-btn:hover::before {
        left: 100%;
      }

      .age-btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 12px 40px rgba(255, 101, 66, 0.4);
      }

      .age-btn:active {
        transform: scale(0.97);
      }

      .age-footer {
        margin-top: 28px;
        display: flex;
        justify-content: center;
        gap: 12px;
        flex-wrap: wrap;
      }

      .age-footer a {
        color: rgba(255, 255, 255, 0.25);
        font-size: 12px;
        text-decoration: none;
        transition: color 0.3s ease;
        letter-spacing: 0.3px;
      }

      .age-footer a:hover {
        color: rgba(255, 255, 255, 0.6);
      }

      .age-footer span {
        color: rgba(255, 255, 255, 0.12);
      }

      .age-divider {
        width: 40px;
        height: 2px;
        background: linear-gradient(90deg, transparent, rgba(255, 101, 66, 0.3), transparent);
        margin: 0 auto 20px;
        border-radius: 2px;
      }

      @media (max-width: 480px) {
        .age-verification {
          padding: 36px 24px 28px;
          border-radius: 24px;
        }
        .age-logo {
          width: 120px;
          margin-bottom: 24px;
        }
        .age-title {
          font-size: 18px;
        }
        .age-subtitle {
          font-size: 14px;
          margin-bottom: 24px;
        }
        .age-btn {
          font-size: 16px;
          padding: 16px;
        }
        .age-warning p {
          font-size: 12px;
        }
        .age-footer a {
          font-size: 11px;
        }
      }

      @media (max-width: 380px) {
        .age-verification {
          padding: 28px 18px 24px;
        }
        .age-logo {
          width: 100px;
        }
        .age-title {
          font-size: 16px;
        }
        .age-btn {
          font-size: 14px;
          padding: 14px;
        }
      }
    </style>
  </head>

  <body>
    <div class="age-verification">
      <img
        src="images/famaflix-logo-Bs6A6sf0.png"
        alt="Privacy"
        class="age-logo"
        loading="eager"
        width="160"
        height="auto"
      />

      <div class="age-divider"></div>

      <h1 class="age-title">Bem-vindo ao Privacy</h1>
      <p class="age-subtitle">
        Conteúdo exclusivo para maiores de 18 anos.
      </p>

      <div class="age-warning">
        <p>
          📌 Ao continuar, você confirma que tem 18 anos ou mais e concorda
          com nossos <strong>Termos de Uso</strong> e
          <strong>Política de Privacidade</strong>.
        </p>
      </div>

      <button class="age-btn" onclick="confirmarIdade()">
        Continuar
      </button>

      <div class="age-footer">
        <a href="/privacidade">Política de Privacidade</a>
        <span>•</span>
        <a href="/termos">Termos de Uso</a>
      </div>
    </div>

    <script>
      // ===== PEGA PARÂMETROS DA URL =====
      function getTrackingParams() {
        const urlParams = new URLSearchParams(window.location.search);
        const params = new URLSearchParams();

        const trackingParams = [
          'fbclid',
          'utm_source',
          'utm_medium',
          'utm_campaign',
          'utm_content',
          'utm_term',
          'ref',
          'source'
        ];

        trackingParams.forEach((param) => {
          const value = urlParams.get(param);
          if (value) {
            params.set(param, value);
          }
        });

        return params.toString();
      }

      // ===== CONFIRMAR IDADE =====
      function confirmarIdade() {
        // 🔥 UM ÚNICO EVENTO - AgeConfirmed (personalizado)
        if (typeof fbq === 'function') {
          fbq('trackCustom', 'AgeConfirmed', {
            content_name: 'Confirmação de Idade',
            content_type: 'gateway'
          });
        }

        // GA4
        if (typeof gtag === 'function') {
          gtag('event', 'confirmar_idade', {
            event_category: 'engajamento',
            event_label: 'idade_confirmada'
          });
        }

        // Preserva parâmetros e redireciona
        const params = getTrackingParams();
        const redirectUrl = params
          ? `privacy.html?${params}`
          : 'privacy.html';

        window.location.href = redirectUrl;
      }

      // ===== RASTREIA ACESSO À PÁGINA - ÚNICO ViewContent =====
      document.addEventListener('DOMContentLoaded', function() {
        // ✅ SOMENTE UM ViewContent - no carregamento da página
        if (typeof fbq === 'function') {
          fbq('track', 'ViewContent', {
            content_name: 'Página de Verificação de Idade',
            content_type: 'landing_page'
          });
        }

     
      });
    </script>
  </body>
</html>
